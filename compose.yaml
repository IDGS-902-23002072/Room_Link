name: room-link

services:
  mysql:
    image: mysql:8.4
    container_name: room-link-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: roomlink_root
      MYSQL_DATABASE: roomlink
      MYSQL_USER: roomlink_app
      MYSQL_PASSWORD: roomlink_school
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    ports:
      - "3307:3306"
    volumes:
      - room_link_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -proomlink_root --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: roomlink_app
      DB_PASSWORD: roomlink_school
      DB_NAME: roomlink
    command: ["npm", "run", "db:migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

volumes:
  room_link_mysql_data:
