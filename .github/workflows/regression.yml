name: Regression

# Gate de regresión obligatorio al llegar a `main`. Ejecuta:
# typecheck → db:check → migraciones → unit → integration → smoke.
# Un fallo en cualquier etapa rompe el merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-backend:
    name: Backend · regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: roomlink_root
          MYSQL_DATABASE: roomlink
          MYSQL_USER: roomlink_app
          MYSQL_PASSWORD: roomlink_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proomlink_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate Drizzle migrations
        run: bun run db:check

      - name: Configurar migraciones de MySQL
        env:
          MYSQL_PWD: roomlink_root
        run: docker exec -e MYSQL_PWD "${{ job.services.mysql.id }}" mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'

      - name: Apply migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: roomlink_root
          DB_NAME: roomlink
        run: bun run db:migrate:bun

      - name: Unit tests
        run: bun run test:unit:bun

      - name: Integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: roomlink_app
          DB_PASSWORD: roomlink_school
          DB_NAME: roomlink
        run: bunx --bun vitest run tests/integration/

      - name: Smoke / regression suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: roomlink_app
          DB_PASSWORD: roomlink_school
          DB_NAME: roomlink
        run: bunx --bun vitest run tests/smoke/

      - name: npm audit (informativo, no falla el gate)
        continue-on-error: true
        run: |
          echo "::group::Advisories de dependencias"
          bun install --frozen-lockfile >/dev/null
          npm audit --omit=dev || true
          echo "Nota: las vulnerabilidades moderadas en tooling de dev (esbuild transitiva por drizzle-kit) están aceptadas; ver .docs/session_state.md."
          echo "::endgroup::"

      - name: Upload coverage (si existe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-regression-backend
          path: backend/coverage
          if-no-files-found: ignore

  e2e-mobile:
    name: Móvil · E2E cross-origin (navegador real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: roomlink_root
          MYSQL_DATABASE: roomlink
          MYSQL_USER: roomlink_app
          MYSQL_PASSWORD: roomlink_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proomlink_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Configurar migraciones de MySQL
        env:
          MYSQL_PWD: roomlink_root
        run: docker exec -e MYSQL_PWD "${{ job.services.mysql.id }}" mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'

      - name: Apply migrations
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: roomlink_root
          DB_NAME: roomlink
        run: npm run db:migrate

      - name: Start backend (background)
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: roomlink_app
          DB_PASSWORD: roomlink_school
          DB_NAME: roomlink
          FRONTEND_ORIGIN: http://localhost:8081
        run: |
          npm run start:node > /tmp/roomlink-regression-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && { echo "backend up"; exit 0; }
            sleep 1
          done
          echo "backend no respondió a tiempo" >&2; exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci && npm --prefix Room_Link ci

      - name: Build mobile web
        working-directory: frontend/Room_Link
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000
        run: npx expo export --platform web

      - name: Serve mobile build (background)
        working-directory: frontend/Room_Link
        run: |
          python3 ../tests/e2e/serve-expo.py dist &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8081/ >/dev/null && { echo "web up"; exit 0; }
            sleep 1
          done
          echo "el build del móvil no se sirvió a tiempo" >&2; exit 1

      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E móvil (navegador real)
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:3000/api/v1
          E2E_WEB_URL: http://localhost:8081
        run: npm run test:e2e

      - name: Publicar evidencias de fallo E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roomlink-regression-mobile
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/roomlink-regression-api.log
            frontend/test-results/
