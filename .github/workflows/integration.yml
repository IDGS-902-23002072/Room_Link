name: Integration

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-frontend:
    name: Frontend · integration tests
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm test -- --testPathPattern='\.integration\.test\.' --ci --runInBand

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  integration-backend:
    name: Backend · integration tests
    runs-on: ubuntu-latest
    if: hashFiles('backend/package.json') != ''
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: roomlink_root
          MYSQL_DATABASE: roomlink
          MYSQL_USER: roomlink_app
          MYSQL_PASSWORD: roomlink_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proomlink_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: roomlink_root
          DB_NAME: roomlink
        run: bun run db:migrate:bun

      - name: Integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: roomlink_app
          DB_PASSWORD: roomlink_school
          DB_NAME: roomlink
        run: bunx --bun vitest run tests/

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-backend
          path: backend/coverage
          if-no-files-found: ignore
