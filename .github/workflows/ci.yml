name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-frontend:
    name: Frontend · lint + unit tests
    runs-on: ubuntu-latest
    # Hasta que exista frontend/package.json este job se saltea solo.
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --testPathPattern='\.unit\.test\.' --ci --coverage --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  lint-and-unit-backend:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    # Hasta que exista backend/package.json este job se saltea solo.
    if: hashFiles('backend/package.json') != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          if grep -q '"lint"[[:space:]]*:' package.json; then
            bun run lint
          else
            echo "::notice::backend/package.json aún no define script 'lint'. Skip."
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Validate Drizzle migrations
        run: bun run db:check

      - name: Unit tests (Bun runtime)
        run: bun run test:unit:bun

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-backend
          path: backend/coverage
          if-no-files-found: ignore

  node-compat-backend:
    name: Backend · Node.js compatibility
    runs-on: ubuntu-latest
    if: hashFiles('backend/package.json') != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  bootstrap-notice:
    name: Nothing initialized yet
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') == '' && hashFiles('backend/package.json') == ''
    steps:
      - run: echo "::notice::Ni frontend/package.json ni backend/package.json existen. CI pasa en modo bootstrap hasta que se inicialicen los proyectos."
