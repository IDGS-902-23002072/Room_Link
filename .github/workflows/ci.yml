name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-automation:
    name: Android · validar automatización sin credenciales
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          bash -n scripts/deploy-android-apk.sh
          python3 -B -m unittest discover -s scripts/tests -p 'test_android_deploy.py'
          node --test scripts/tests/android-config.test.cjs

  lint-and-unit-frontend:
    name: Frontend móvil · pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix Room_Link ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  lint-and-unit-backend:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          if grep -q '"lint"[[:space:]]*:' package.json; then
            bun run lint
          else
            echo "::notice::backend/package.json aún no define script 'lint'. Skip."
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Validate Drizzle migrations
        run: bun run db:check

      - name: Unit tests (Bun runtime)
        run: bun run test:unit:bun

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-backend
          path: backend/coverage
          if-no-files-found: ignore

  node-compat-backend:
    name: Backend · Node.js compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (reporte JSON para F3)
        run: npm run test:unit:json

      - name: Subir resultados de Vitest a monitoreo
        if: always()
        env:
          MONITOR_INGEST_TOKEN: ${{ secrets.MONITOR_INGEST_TOKEN }}
          MONITOR_INGEST_URL: ${{ vars.MONITOR_INGEST_URL }}
          VITEST_JSON_REPORT: ../reports/vitest-results.json
        run: npm run monitor:ingest -- --suite=backend:unit --complete

  web:
    name: Web Vite · lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
