name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    # Hasta que exista app/package.json este job se saltea solo.
    if: hashFiles('app/package.json') != ''
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --testPathPattern='\.unit\.test\.' --ci --coverage --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: app/coverage
          if-no-files-found: ignore

  bootstrap-notice:
    name: App not initialized yet
    runs-on: ubuntu-latest
    if: hashFiles('app/package.json') == ''
    steps:
      - run: echo "::notice::app/package.json todavía no existe. CI pasa en modo bootstrap hasta que se inicialice el proyecto Expo."
