name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil EAS a usar
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  eas-build:
    name: EAS build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    if: hashFiles('app/package.json') != ''
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build se dispara contra el perfil elegido. Para que esto funcione
      # hay que haber configurado `eas.json` dentro de app/ y haber corrido
      # `eas build:configure` una vez. Hasta entonces el step siguiente falla
      # a propósito con mensaje claro.
      - name: Build (Android + iOS)
        run: |
          if [ ! -f eas.json ]; then
            echo "::error::Falta app/eas.json. Correr 'eas build:configure' localmente y commitear." >&2
            exit 1
          fi
          eas build --non-interactive --no-wait \
            --profile "${PROFILE:-preview}" \
            --platform all
        env:
          PROFILE: ${{ github.event.inputs.profile || 'preview' }}
